# Bouwt de PP Kiosk-installer in de cloud (geen lokale toolchain nodig).
# Elke push: bouwen + rooktest. Branch release/X.Y.Z: ook een GitHub-release met de installer.
name: Windows installer
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Qt installeren
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: qtmultimedia qtimageformats qtpdf qtspeech
          cache: true
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Bouwen + installer maken
        shell: pwsh
        run: |
          # Branch release/1.0.0 bepaalt het versienummer; gewone pushes heten "dev"
          $version = if ($env:GITHUB_REF_NAME -like 'release/*') { $env:GITHUB_REF_NAME.Substring(8) } else { '0.0.0' }
          "PPKIOSK_VERSION=$version" >> $env:GITHUB_ENV
          .\scripts\build-installer.ps1 -QtDir "$env:QT_ROOT_DIR" -Version $version
      - name: Rooktest (start de app op de runner)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $log = "$env:LOCALAPPDATA\PPKiosk\ppkiosk.log"
          $checks = [ordered]@{ 'home' = 'Home screen ready'; 'agenda' = 'Agenda test: now 2 title Dagbesteding next Lunch'; 'admin' = 'Admin test local 200 items'; 'stream' = 'Stream screen opened'; 'presentation' = 'Presentation started: Menu van de week slides 7'; 'shortcuts' = 'Shortcuts screen opened: 16'; 'upload' = 'Upload test: Rooktest converted slides 2'; 'menu' = 'Menu today: yes'; 'speak' = 'Speaker: announce Het is tijd voor: Test'; 'screensaver' = 'Screensaver started'; 'menuboard' = 'Menu board presentation: 7 slides'; 'radiosaver' = 'Radio screensaver started'; 'news' = 'News ticker: 3 items'; 'music' = 'Music still playing after page change: yes'; 'memory' = 'Game started: memory 6 pairs'; 'puzzle' = 'Game started: puzzle 3x3'; 'theme' = 'Theme: volwassen'; 'background' = 'Background photo shown'; 'voice' = 'Voice phrases understood: 5/5'; 'stats' = 'Stats test: Rooktest'; 'backup' = 'restore ok'; 'login' = 'Login test: ok'; 'newspage' = 'News page opened: 3 items, text yes'; 'volume' = 'Volume test: output 50'; 'glass' = 'Theme: glas'; 'glassboard' = 'slides glass'; 'extras' = 'Holidays: 2026-04-05=Eerste Paasdag 2026-04-27=Koningsdag 2025-04-26=Koningsdag'; 'reminder' = 'Reminder popup: yes'; 'weatherpage' = 'Weather page opened' }
          foreach ($mode in $checks.Keys) {
            $env:BIGSCREEN_SELFTEST = $mode
            New-Item -ItemType Directory -Force shots | Out-Null
            $env:PPKIOSK_SHOT = "$PWD\shots\$mode-app.png"
            $p = Start-Process dist\PPKiosk.exe -PassThru
            Start-Sleep 14
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen(0, 0, 0, 0, $bmp.Size)
            $bmp.Save("shots\$mode.png", [System.Drawing.Imaging.ImageFormat]::Png)
            if ($p.HasExited) { "RESULT: EXITED code {0} (0x{0:X8})" -f $p.ExitCode } else { "RESULT: RUNNING"; Stop-Process -Id $p.Id -Force }
            if (Test-Path $log) { "--- log ---"; Get-Content $log } else { "NO LOG FILE" }
            if (-not (Test-Path $log) -or -not (Select-String -Path $log -Pattern "Window shown" -Quiet)) { throw "Rooktest mislukt: venster niet getoond" }
            if (-not (Select-String -Path $log -Pattern $checks[$mode] -SimpleMatch -Quiet)) { throw "Rooktest mislukt: $mode ($($checks[$mode]) niet in het log)" }
            if ($mode -eq 'admin' -and (Select-String -Path $log -Pattern "Admin test lan-wrong 200" -SimpleMatch -Quiet)) { throw "Rooktest mislukt: beheer zonder goede code werd toegelaten" }
            if (Select-String -Path $log -Pattern "TypeError|ReferenceError" -Quiet) { throw "Rooktest mislukt: QML-fout in het log ($mode)" }
          }
      - name: Schermafbeeldingen bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermafbeeldingen
          path: shots/*.png
          if-no-files-found: ignore
      - name: Installer bewaren
        uses: actions/upload-artifact@v4
        with:
          name: PPKiosk-installer
          path: out/*.exe
      - name: Installer testen (stil installeren)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem out/*.exe | Select-Object -First 1).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          "Installer exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Installer mislukt" }
          schtasks /Query /TN "PP Kiosk bijwerken" /V /FO LIST | Select-String "TaskName|Run As|Task To Run|Status"
          if ($LASTEXITCODE -ne 0) { throw "Taak 'PP Kiosk bijwerken' ontbreekt" }
          if (-not (Test-Path "$env:ProgramFiles\PP Kiosk\PPKiosk.exe")) { throw "PPKiosk.exe niet geinstalleerd" }
          Get-Process PPKiosk -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 0
      - name: Oude release van dezelfde versie opruimen
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v$env:PPKIOSK_VERSION" -R $env:GITHUB_REPOSITORY --yes --cleanup-tag 2>$null
          exit 0
      - name: Release maken
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PPKIOSK_VERSION }}
          name: PP Kiosk ${{ env.PPKIOSK_VERSION }}
          target_commitish: ${{ github.sha }}
          files: out/*.exe
          generate_release_notes: true
      # Openbare downloadplek voor automatisch bijwerken (de broncode blijft privé).
      # Nodig: openbare repo firefly2008/pp-kiosk-releases en geheim RELEASES_TOKEN
      # (fine-grained token met Contents: Read and write op alleen die repo).
      - name: Installer in openbare repo zetten
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { "::warning::Geen RELEASES_TOKEN: installer niet in firefly2008/pp-kiosk-releases gezet"; exit 0 }
          $tag = "v$env:PPKIOSK_VERSION"
          $notes = "PP Kiosk $env:PPKIOSK_VERSION voor Windows 10/11 (x64).`n`nDownload de installer hieronder; PP Kiosk werkt zichzelf daarna stil bij."
          gh release delete $tag -R firefly2008/pp-kiosk-releases --yes --cleanup-tag 2>$null
          gh release create $tag (Get-ChildItem out/*.exe).FullName -R firefly2008/pp-kiosk-releases --title "PP Kiosk $env:PPKIOSK_VERSION" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { "::warning::Publiceren in firefly2008/pp-kiosk-releases mislukt"; exit 0 }
